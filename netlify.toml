[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.166.0"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# The paper PDF is also hosted on consciousness-is-unambiguous.com; point
# search engines at that copy. Keep this if the file is renamed.
[[headers]]
  for = "/uploads/consciousness-and-unambiguous-representations.pdf"
  [headers.values]
    Link = "<https://consciousness-is-unambiguous.com/>; rel=\"canonical\""
