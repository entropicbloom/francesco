<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-page{{ end }}">
  <a class="skip" href="#main">Skip to content</a>
  {{ block "main" . }}{{ end }}

    <div class="wrap footer__inner">
      <span>© {{ now.Year }} Francesco Lässig</span>
    </div>
  </footer>
</body>
</html>
