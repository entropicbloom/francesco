<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Probes</title>
  <meta name="description" content="Short prompts sent to models from several providers, five times each, and how the replies differ.">
  <style>
    :root {
      --bg: #fff;
      --ink: #111;
      --muted: #777;
      --faint: #bbb;
      --line: #e6e6e6;
      --panel: #f6f6f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --ink: #eee;
        --muted: #999;
        --faint: #555;
        --line: #2a2a2a;
        --panel: #1a1a1a;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      padding: 48px 16px 80px;
    }

    main { max-width: 600px; margin: 0 auto; }

    .intro { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
    .intro strong { color: var(--ink); font-weight: 600; }

    nav { display: flex; flex-direction: column; align-items: flex-start; border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 32px; }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      padding: 3px 0 3px 18px;
      position: relative;
    }
    nav a:hover { color: var(--ink); }
    nav a[aria-current="page"] { color: var(--ink); }
    nav a[aria-current="page"]::before { content: "→"; position: absolute; left: 0; }
    .nav-group { font-size: 12px; color: var(--faint); padding: 10px 0 2px; }
    .nav-group:first-child { padding-top: 0; }

    h1 { font-size: 24px; font-weight: 400; margin-bottom: 20px; }

    .row { border-bottom: 1px solid var(--line); }
    .row-head { display: flex; align-items: center; min-height: 36px; }
    .row-name { flex: 0 0 150px; font-size: 14px; }
    .dots { display: flex; gap: 2px; }

    .dot {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      background: none; border: 0; border-radius: 50%;
      cursor: pointer;
    }
    .dot:hover, .dot:focus-visible { background: var(--panel); outline: none; }
    .dot.selected { background: var(--line); }

    .mark { width: 14px; height: 14px; border-radius: 50%; display: block; position: relative; }
    .mark.c0 { background: var(--ink); }
    /* The inner dot is a centered gradient, not a separate element, so it cannot round off-center. */
    .mark.c1 { border: 1.5px solid var(--ink); background: radial-gradient(circle closest-side, var(--ink) 2.2px, transparent 2.7px); }
    .mark.c2 { border: 1.5px solid var(--faint); }
    .mark.m-empty { border: 1.5px solid var(--faint); }
    /* Pick probes draw a sprite per reply instead of a dot. */
    .chart.picks .dot { width: 44px; height: 44px; border-radius: 8px; }
    .mark.sprite { width: 36px; height: 36px; border-radius: 0; object-fit: contain; image-rendering: pixelated; }
    .mark.m-check { border: 1.5px solid var(--ink); }
    .mark.m-check::after {
      content: ""; position: absolute; left: 4px; top: 2.3px;
      width: 2.4px; height: 4.6px; border: solid var(--ink); border-width: 0 1.4px 1.4px 0; transform: rotate(45deg);
    }

    .reply {
      background: var(--panel);
      border-radius: 6px;
      padding: 16px;
      margin: 4px 0 12px;
      font-size: 14px;
    }
    .reply-meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    .reply-meta .mark { width: 10px; height: 10px; }
    .reply-meta .mark.sprite { width: 22px; height: 22px; }
    .legend .mark.sprite { width: 24px; height: 24px; transform: none; }
    .legend li:has(.sprite) { align-items: center; }
    .reply-meta .mark.c1 { background: radial-gradient(circle closest-side, var(--ink) 1.3px, transparent 1.8px); }
    .reply-meta .mark.m-check::after { left: 2.7px; top: 1.2px; width: 1.8px; height: 3.4px; border-width: 0 1.1px 1.1px 0; }
    .reply-body p, .reply-body ul, .reply-body ol { margin-bottom: 8px; }
    .reply-body > :last-child { margin-bottom: 0; }
    .reply-body ul, .reply-body ol { padding-left: 20px; }

    .legend { list-style: none; margin: 24px 0 32px; font-size: 13px; color: var(--muted); }
    .legend li { display: flex; gap: 12px; align-items: baseline; margin-bottom: 8px; }
    .legend .mark { flex: 0 0 auto; transform: translateY(2px); }

    .method { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; }
    .method a { color: inherit; }

    .providers { display: flex; gap: 16px; font-size: 13px; margin-bottom: 16px; }
    .providers button { background: none; border: 0; padding: 0; font: inherit; color: var(--muted); cursor: pointer; }
    .providers button:hover { color: var(--ink); }
    .providers button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
    .group-head { font-size: 12px; color: var(--muted); padding: 20px 0 4px; border-bottom: 1px solid var(--line); }
    .chart > .group-head:first-child { padding-top: 0; }

    @media (max-width: 420px) {
      .row-name { flex-basis: 110px; font-size: 13px; }
      .dot { width: 26px; height: 26px; }
      .chart.picks .dot { width: 38px; height: 38px; }
      .mark.sprite { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="intro"><strong>LLM probes</strong><br>Five replies per model.</p>
    <nav id="nav" aria-label="Probes"></nav>
    <section id="probe"></section>
  </main>

  <script>
    let data, current, selected = null, provider = "all";
    const PROVIDER_NAMES = { claude: "Claude", openai: "OpenAI", qwen: "Qwen", kimi: "Kimi" };

    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const inline = s => esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<em>$2</em>");

    // Minimal Markdown: paragraphs, bullet lists, numbered lists, bold, italics.
    function md(text) {
      const out = [];
      let list = null;
      for (const line of text.split("\n")) {
        const ul = line.match(/^\s*[-*]\s+(.*)/), ol = line.match(/^\s*\d+\.\s+(.*)/);
        const kind = ul ? "ul" : ol ? "ol" : null;
        if (kind) {
          if (list !== kind) { if (list) out.push(`</${list}>`); out.push(`<${kind}>`); list = kind; }
          out.push(`<li>${inline((ul || ol)[1])}</li>`);
        } else {
          if (list && line.trim() === "") continue;
          if (list) { out.push(`</${list}>`); list = null; }
          if (line.trim()) out.push(`<p>${inline(line)}</p>`);
        }
      }
      if (list) out.push(`</${list}>`);
      return out.join("");
    }

    // Groups are drawn on one concern scale (● ◉ ○); a group outside it can set its own mark.
    // Pick probes (e.g. Pokémon) give each label a sprite instead.
    const mark = cls => {
      const l = current.labels[cls];
      if (l.sprite) return `<img class="mark sprite" src="${l.sprite}" alt="" aria-hidden="true">`;
      return `<span class="mark ${l.mark ? "m-" + l.mark : "c" + cls}" aria-hidden="true"></span>`;
    };

    function renderNav() {
      let lastGroup = null;
      document.getElementById("nav").innerHTML = data.probes.map(p => {
        const head = p.group !== lastGroup ? `<div class="nav-group">${esc(p.group)}</div>` : "";
        lastGroup = p.group;
        return `${head}<a href="#${p.id}"${p.id === current.id ? ' aria-current="page"' : ""}>${esc(p.prompt)}</a>`;
      }).join("");
    }

    function renderProbe() {
      const p = current;
      let lastProvider = null;
      const rows = p.models.map((m, mi) => {
        if (provider !== "all" && m.provider !== provider) return "";
        let head = "";
        if (provider === "all" && m.provider !== lastProvider) {
          head = `<div class="group-head">${PROVIDER_NAMES[m.provider]}</div>`;
          lastProvider = m.provider;
        }
        // Show replies grouped by class so each row reads at a glance; keep the original index for labels.
        // Pick probes: "lead" picks first (e.g. the Porygon family), then this row's picks by count, "no pick" last.
        const n = {};
        m.replies.forEach(r => n[r.cls] = (n[r.cls] || 0) + 1);
        const rank = c => { const l = p.labels[c]; return l.lead ? [0, c] : l.sprite ? [1, -n[c], c] : [2, c]; };
        const cmp = (x, y) => { for (let k = 0; k < Math.max(x.length, y.length); k++) if (x[k] !== y[k]) return (x[k] ?? 0) - (y[k] ?? 0); return 0; };
        const order = m.replies.map((r, i) => i).sort((a, b) => cmp(rank(m.replies[a].cls), rank(m.replies[b].cls)) || a - b);
        const dots = order.map(i => {
          const r = m.replies[i], isSel = selected && selected[0] === mi && selected[1] === i;
          return `<button class="dot${isSel ? " selected" : ""}" data-m="${mi}" data-i="${i}"
            aria-expanded="${isSel}" title="${esc(m.name)}, reply ${i + 1}: ${esc(p.labels[r.cls].name)}">${mark(r.cls)}</button>`;
        }).join("");
        let reply = "";
        if (selected && selected[0] === mi) {
          const r = m.replies[selected[1]];
          reply = `<div class="reply"><div class="reply-meta">${mark(r.cls)}${esc(m.name)} · reply ${selected[1] + 1} of ${m.replies.length} · ${esc(p.labels[r.cls].name)}</div>
            <div class="reply-body">${md(r.text)}</div></div>`;
        }
        return `${head}<div class="row"><div class="row-head"><span class="row-name">${esc(m.name)}</span><div class="dots">${dots}</div></div>${reply}</div>`;
      }).join("");

      const legend = p.labels.map((l, i) =>
        `<li title="${esc(l.def)}">${mark(i)}<span>${esc(l.name)}</span></li>`).join("");

      document.getElementById("probe").innerHTML = `
        <h1>“${esc(p.prompt)}”</h1>
        <div class="providers">${[["all", "All"], ...[...new Set(p.models.map(m => m.provider))].map(k => [k, PROVIDER_NAMES[k]])].map(([k, n]) => `<button data-p="${k}" aria-pressed="${provider === k}">${n}</button>`).join("")}</div>
        <div class="chart${p.labels.some(l => l.sprite) ? " picks" : ""}">${rows}</div>
        <ul class="legend">${legend}</ul>
        <p class="method">${p.date} · no system prompt · Claude models through the Claude API, OpenAI, Qwen and Kimi models through OpenRouter · replies classified by Claude Opus 5.5<br>${p.credit ? `<a href="${p.credit[1]}">${esc(p.credit[0])}</a> · ${esc(p.credit[2])}<br>` : ""}Download all replies: <a href="replies.csv" download>CSV</a>, <a href="data.json" download="llm-probes.json">JSON</a></p>`;
    }

    function route() {
      const id = location.hash.slice(1);
      current = data.probes.find(p => p.id === id) || data.probes[0];
      selected = null;
      renderNav();
      renderProbe();
    }

    document.getElementById("probe").addEventListener("click", e => {
      const pb = e.target.closest(".providers button");
      if (pb) {
        provider = pb.dataset.p;
        selected = null;
        renderProbe();
        return;
      }
      const b = e.target.closest(".dot");
      if (!b) return;
      const sel = [+b.dataset.m, +b.dataset.i];
      selected = selected && selected[0] === sel[0] && selected[1] === sel[1] ? null : sel;
      renderProbe();
      const dot = document.querySelector(`.dot[data-m="${sel[0]}"][data-i="${sel[1]}"]`);
      dot.focus({ preventScroll: true });
    });

    window.addEventListener("hashchange", route);

    fetch("data.json").then(r => r.json()).then(d => { data = d; route(); });
  </script>
</body>
</html>
